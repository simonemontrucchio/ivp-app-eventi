<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barolo & Friends</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="error-log" style="display:none; background: red; color: white; padding: 20px; font-family: monospace;"></div>
    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            var log = document.getElementById('error-log');
            log.style.display = 'block';
            log.innerHTML += 'Error: ' + msg + '<br>Line: ' + lineNo;
            return false;
        };
    </script>
    
    <header class="app-header">
        <div class="header-top">
            <div class="header-titles">
                <h1 id="event-title">Barolo & Friends</h1>
                <div class="subtitle" id="event-date-city">Oslo, August 31st 2026</div>
            </div>
            <button id="btn-info" class="info-btn">Event Info</button>
        </div>
        <div class="welcome-box">
            <p id="welcome-message">Welcome</p>
            <p class="slogan" id="event-slogan">Piedmont: where wine is history.</p>
        </div>
    </header>

    <nav class="tab-nav">
        <button class="tab-btn active" id="nav-producers">Producers <span class="count-badge" id="count-producers">0</span></button>
        <button class="tab-btn" id="nav-masterclasses">Masterclasses</button>
        <button class="tab-btn" id="nav-notebook">My Notebook <span class="count-badge" id="count-notebook">0</span></button>
    </nav>

    <section id="section-producers">
        <div class="filters-wrap">
            <div class="search-input-wrap">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="search-input" placeholder="Search producer, wine, region...">
            </div>
            <div class="quick-filters">
                <button id="filter-barolo" class="filter-btn">🍷 Only Barolo</button>
                <button id="filter-bio" class="filter-btn">🍇 Organic / Bio</button>
                <button id="filter-seeking" class="filter-btn">🤝 Seeking Importer</button>
            </div>
        </div>
        <main id="producer-list" class="producer-grid"></main>
    </section>

    <section id="section-masterclasses" style="display:none;">
        <h3 class="section-title">Masterclass Programme</h3>
        <div id="masterclass-list"></div>
    </section>

    <section id="section-notebook" style="display:none;">
        <div style="padding: 20px;">
            <div id="notebook-list" class="wines-list"></div>
            <button id="export-notes" class="btn-primary" style="margin-top:25px;">📤 Email my tasting notes</button>
        </div>
    </section>

    <dialog id="modal-producer" class="modal">
        <div class="modal-header">
            <h2 id="mp-name">Producer Name</h2>
            <button class="close-btn" data-close="modal-producer">&times;</button>
        </div>
        <div class="modal-body">
            <div class="detail-top">
                <div class="mp-logo-container"><img id="mp-logo" src="assets/placeholder.png" alt="Logo"></div>
                <div>
                    <div class="detail-table" id="mp-desk">Table 0</div>
                    <div class="detail-region" id="mp-region">Region, City</div>
                    <div class="status-badge" style="background:#f3f4f6; color:#4b5563; margin-bottom: 15px;"><span class="dot" style="background:currentColor;"></span> <span id="mp-market-status">Status</span></div>
                </div>
            </div>
            <div class="eno-icons" id="mp-icons"></div>
            <div class="contact-box">
                <p>At the desk you will meet:<br><span id="mp-contact">Name, Role</span></p>
                <a id="mp-email" href="#" class="btn-primary" style="margin-top:10px;">✉️ Contact via Email</a>
            </div>
            <h3 class="section-title">Wines for tasting</h3>
            <div id="mp-wines" class="wines-list"></div>
        </div>
    </dialog>

    <dialog id="modal-info" class="modal">
        <div class="modal-header">
            <h2>Event Info</h2>
            <button class="close-btn" data-close="modal-info">&times;</button>
        </div>
        <div class="modal-body">
            <div class="info-box">
                <p><strong>Date:</strong> August 31st, 2026</p>
                <p><strong>Venue:</strong> Gamle Logen, Oslo</p>
            </div>
            <button class="btn-outline" onclick="alert('Floor plan map opens here')">🗺️ View Floor Plan</button>
            <button class="btn-outline" onclick="alert('Opening Maps...')">📍 Open in Maps</button>
            <button class="btn-outline" onclick="alert('Added to calendar!')">📅 Add to Calendar</button>
        </div>
    </dialog>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
